<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#stage{position:absolute;width:100%;height:100%;pointer-events:none}#sprites,#stats{position:absolute;inset:0;pointer-events:none}</style>
<script>
document.documentElement.setAttribute('data-pks-ext-url',new URL('.',location.href).href);
window.ptbShowmotion={paused:true,handles:[],contexts:[]};
window.ptbPost=message=>window.webkit?.messageHandlers?.showmotion?.postMessage(message);
window.addEventListener('error',event=>ptbPost({kind:'error',message:String(event.message)}));
window.addEventListener('unhandledrejection',event=>ptbPost({kind:'error',message:String(event.reason)}));
</script></head><body><div id="stage"><div id="sprites"><div></div><div></div><div></div><div></div></div><div id="stats"></div></div>
<script src="ptb-engine.js"></script><script src="bridge.js"></script></body></html>
